{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="container section">
  <div class="auth-card k-panel p-4 p-md-5">
    <h1 class="h3 mb-4">Change password</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/form_errors.html" %}
      {% for field in form %}<div class="mb-3">{% include "partials/form_field.html" %}</div>{% endfor %}
      <div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Update password</button>
      <a href="{% url 'dashboard:settings' %}" class="btn btn-light">Cancel</a></div>
    </form>
  </div>
</div>
{% endblock %}
